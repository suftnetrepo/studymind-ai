name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy StudyMind API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DO_HOST }}
          username: root
          key:      ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            echo "── Pulling latest code ──"
            cd /srv/studymind
            git pull origin main

            echo "── Building new API image ──"
            docker compose -f docker-compose.prod.yml build api

            echo "── Restarting API (zero downtime) ──"
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            echo "── Waiting for API to start ──"
            HEALTH="down"
            for i in 1 2 3 4 5 6; do
              sleep 10
              HEALTH=$(curl -s http://localhost:8000/api/health 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','down'))" 2>/dev/null || echo "down")
              echo "  Attempt $i: $HEALTH"
              if [ "$HEALTH" = "ok" ]; then
                break
              fi
            done

            if [ "$HEALTH" != "ok" ]; then
              echo "Health check failed after 60 seconds: $HEALTH"
              docker logs studymind_api --tail=20
              exit 1
            fi

            echo "── Deploy complete — status: $HEALTH ──"
