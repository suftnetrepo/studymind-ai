services:

  typesense:
    image: typesense/typesense:0.25.2
    container_name: studymind_typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    # The API key comes from TYPESENSE_API_KEY in .env.prod via env_file, which Typesense reads natively.
    # Do not use --api-key=${TYPESENSE_API_KEY} here: Compose fills ${...} in `command` from the shell or a
    # project .env, not from env_file, so a plain `docker compose up` produced an empty key and Typesense exited.
    env_file: .env.prod
    command: --data-dir=/data --enable-cors

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studymind_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env.prod
    depends_on:
      - typesense
    volumes:
      - uploads_data:/app/uploads

volumes:
  typesense_data:
  uploads_data:
